<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホでの縮小を防ぎ、画面幅にピッタリ合わせる重要な1行 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早稲田大学応援用サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ↓↓↓ 全体を囲む「透明な箱」のスタート ↓↓↓ -->
    <div class="container">
        <!-- ▼ 【追加】ここにタブメニューを追加します ▼ -->
        <nav class="tab-menu">
            <a href="index.html" class="tab-item active">RACE</a>
            <a href="team.html" class="tab-item">TEAM</a>
        </nav>
        <!-- ▲ 追加ここまで ▲ -->

    <!-- ▼ ここから：ロゴとタイトルをまとめる箱 ▼ -->
        <div class="header-container">
            <img src="emblem-logo.png" alt="サイトのロゴ" class="header-image">
            <h1>全日本大学選手権2026_早稲田大学応援用サイト</h1>
        </div>
        <!-- ▲ ここまで ▲ -->
    
  <!-- ▼ ここからカウントダウン部分 ▼ -->
        <div class="countdown-box">
            <div class="countdown-days">
                <span id="days">--</span>
                <span class="days-label">DAYS 日</span>
            </div>
            <div class="countdown-divider"></div>
            <div class="countdown-time-area">
                <div class="countdown-title">レース初日まで</div>
                <div class="countdown-numbers">
                    <div><span id="hours">--</span><span class="time-unit">時間</span></div>
                    <div><span id="minutes">--</span><span class="time-unit">分</span></div>
                    <div><span id="seconds">--</span><span class="time-unit">秒</span></div>
                </div>
            </div>
        </div>
        <!-- ▲ カウントダウンここまで ▲ -->

    <!-- テスト用動画のコード -->
  <iframe width="560" height="315" src="https://www.youtube.com/embed/ya2YQLYeeQk?si=H3ssvLasJvgviMGN" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <h2>本日のレーススケジュール</h2>
 <!-- <ul>に「race-list」という目印（クラス）をつけます -->
    <ul class="race-list">
        <li>
            <span class="race-name">JW1x 女子シングルスカル</span>
            <span class="race-round">D決勝</span>
        </li>
        <li>
            <span class="race-name">JM1x 男子シングルスカル</span>
            <span class="race-round">C決勝</span>
        </li>
    </ul>
    <!-- ↑↑↑ 全体を囲む「透明な箱」の終わり ↑↑↑ -->
    </div>
</body>
<script>
    // ▼ レース初日の日時をここに設定してください（例: 2026年9月1日 09:00:00）
    const raceDate = new Date('2026-08-27T09:00:00');

    function updateCountdown() {
        const now = new Date();
        const diff = raceDate - now;

        if (diff <= 0) {
            document.querySelector('.countdown-box').innerHTML = '<div style="text-align:width:100%; font-weight:bold;">レース初日を迎えました！</div>';
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60 * 60 / 60) / 1000 * 60); // 修正: 分の計算
        // 正確な計算式に直します
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('days').textContent = days;
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

</body>
</html>
</html>
